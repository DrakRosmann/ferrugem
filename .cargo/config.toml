[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# Liga com o GNU ld do sistema; o script de ligação vem do build.rs.
linker = "ld"
rustflags = [
    "-C", "linker-flavor=ld",
    "-C", "relocation-model=static",
]
# `cargo run` gera o binário plano e inicia o QEMU.
runner = "scripts/qemu.sh"
