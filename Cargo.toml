[package]
name = "ferrugem"
version = "0.1.0"
edition = "2024"

[lib]
# O Rust gera uma biblioteca estática (.a) que o `ld` junta com o boot.o
crate-type = ["staticlib"]
path = "src/lib.rs"

# Num kernel não existe "desenrolar a pilha" em caso de pânico: só paramos.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
