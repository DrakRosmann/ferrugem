# Compila o kernel e os programas de usuário e roda os testes de integração
# (tests/*.txt) no QEMU, a cada push e pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # Tamanhos de bloco do ext2: cada um muda a estrutura do disco.
        bloco: [1024, 4096]
    name: testes (blocos de ${{ matrix.bloco }} bytes)
    steps:
      - uses: actions/checkout@v4

      - name: Rust estável com o alvo x86_64-unknown-none
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: QEMU e e2fsprogs (mkfs.ext2, e2fsck)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 e2fsprogs

      - name: Cache da musl e do busybox
        uses: actions/cache@v4
        with:
          path: |
            target/externos
            target/musl
            target/busybox
          key: busybox-${{ runner.os }}-${{ hashFiles('scripts/busybox.sh') }}

      - name: Compilar o busybox (com a musl)
        run: scripts/busybox.sh

      - name: Compilar
        run: cargo build --release

      - name: Testes no QEMU
        run: python3 scripts/testar.py
        env:
          FERRUGEM_BLOCO: ${{ matrix.bloco }}

