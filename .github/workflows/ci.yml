# Compila o kernel e os programas de usuário e roda os testes de integração
# (tests/*.txt) no QEMU, a cada push e pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rust estável com o alvo x86_64-unknown-none
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Compilar
        run: cargo build --release

      - name: Testes no QEMU
        run: python3 scripts/testar.py

