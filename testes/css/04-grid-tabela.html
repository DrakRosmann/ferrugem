<!doctype html><html><head><style>
body{margin:0;font:16px/20px monospace} div{box-sizing:border-box}
.g{display:grid;width:600px}
#a{grid-template-columns:100px 1fr 2fr;gap:10px} #a div{height:20px}
#b{grid-template-columns:repeat(3,1fr);grid-auto-rows:30px} #b2{grid-column:span 2} #b5{grid-row:span 2}
#c{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px} #c div{height:10px}
#d{grid-template-areas:"h h" "s m" "f f";grid-template-columns:100px 1fr;grid-template-rows:20px 40px 20px} #dh{grid-area:h} #ds{grid-area:s} #dm{grid-area:m} #df{grid-area:f}
#e{grid-template-columns:1fr 1fr;grid-template-rows:50px;height:100px;align-items:center;justify-items:center} #e div{width:20px;height:20px}
#f{grid-template-columns:100px 100px} #f1{grid-column:2;grid-row:1;height:10px} #f2{grid-column:1 / 3;height:10px} #f3{height:10px}
#g{grid-template-columns:auto 100px} #g1{width:50px;height:10px} #g2{height:10px}
#h{grid-template-columns:50px 50px;justify-content:end;gap:4px} #h div{height:4px}
table{width:400px;border-spacing:0;border-collapse:separate} td{padding:0;height:20px}
#t1 td{width:100px} #t2{border-spacing:5px;width:300px} #t3 td{padding:2px}
#t4{width:auto} #t4 td div{width:50px;height:10px}
#t5{table-layout:fixed;width:300px} #td5{width:50px}
#cs{background:#ccc} 
</style></head><body>
<div class=g id=a><div id=a1></div><div id=a2></div><div id=a3></div><div id=a4></div></div>
<div class=g id=b><div id=b1></div><div id=b2></div><div id=b3></div><div id=b4></div><div id=b5></div><div id=b6></div></div>
<div class=g id=c><div id=c1></div><div id=c2></div><div id=c3></div><div id=c4></div><div id=c5></div></div>
<div class=g id=d><div id=dh></div><div id=ds></div><div id=dm></div><div id=df></div></div>
<div class=g id=e><div id=e1></div><div id=e2></div></div>
<div class=g id=f><div id=f1></div><div id=f2></div><div id=f3></div></div>
<div class=g id=g><div id=g1></div><div id=g2></div></div>
<div class=g id=h><div id=h1></div><div id=h2></div></div>
<table id=t1><tr id=r1><td id=c11></td><td id=c12></td></tr><tr id=r2><td id=c21></td><td id=c22></td></tr></table>
<table id=t2><tr><td id=t21></td><td id=t22></td><td id=t23></td></tr></table>
<table id=t3><tr><td id=t31 colspan=2></td></tr><tr><td id=t32></td><td id=t33></td></tr></table>
<table id=t4><tr><td id=t41><div id=d41></div></td><td id=t42><div id=d42></div></td></tr></table>
<table id=t5><tr><td id=td5></td><td id=td6></td><td id=td7></td></tr></table>
<table style="width:200px;border-spacing:0"><tr><td id=r3 rowspan=2></td><td id=r4></td></tr><tr><td id=r5></td></tr></table>
<div style="display:table;width:200px"><div style="display:table-row"><div id=dt1 style="display:table-cell;height:10px"></div><div id=dt2 style="display:table-cell;width:50px"></div></div></div>
</body></html>
