<!doctype html><html><head><style>
*{box-sizing:content-box} body{margin:10px;font:16px/20px monospace}
.b{background:#ccc}
#m1{height:20px;margin-bottom:30px} #m2{height:20px;margin-top:10px}
#pai{margin-top:40px;background:#eee} #filho{margin-top:25px;height:10px}
#w{width:50%;height:10px;padding:5px;border:2px solid red;margin:0 auto}
#bb{box-sizing:border-box;width:200px;height:50px;padding:10px;border:5px solid}
#min{width:100px;min-width:150px;max-height:5px;height:30px} #max{width:500px;max-width:120px;min-height:33px;height:3px}
#calc{width:calc(100% - 40px);height:calc(10px + 1em)} #em{width:10em;height:2em;margin:1em}
#vazio{margin:20px 0} #apos{height:5px}
#neg{margin-top:-5px;height:5px} #ov{overflow:hidden;width:60px} #ovf{margin-top:10px;height:9px}
#auto{width:100px;margin-left:auto;height:3px} #right{width:100px;margin-right:auto;margin-left:30px;height:3px}
</style></head><body>
<div id=m1 class=b></div><div id=m2 class=b></div>
<div id=pai><div id=filho></div></div>
<div id=w class=b></div><div id=bb></div><div id=min></div><div id=max></div><div id=calc></div><div id=em></div>
<div id=vazio></div><div id=apos></div><div id=neg></div><div id=ov><div id=ovf></div></div><div id=auto></div><div id=right></div>
</body></html>
