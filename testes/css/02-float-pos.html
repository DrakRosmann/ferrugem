<!doctype html><html><head><style>
body{margin:0;font:16px/20px monospace} div{box-sizing:border-box}

</style></head><body>
<div id=c><div id=f1></div><div id=f2></div><div id=f3></div><div id=f4></div><div id=cl></div></div>
<div id=bfc><div id=bf1></div></div>
<div id=rel><div id=a1></div><div id=a2></div><div id=a3></div><div id=a4></div><div id=a5></div></div>
<div id=est></div><div id=a6></div><div id=fix></div><div id=rb></div>
<div id=apb><div id=apc></div></div>
</body></html>
